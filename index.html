<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anneler Günü Kutlaması</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a52 0%, #2c4a6a 50%, #0f2a42 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
        }

        h1 {
            color: #fff;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            color: #e8d5f2;
            font-size: 1.3em;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .flowers-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .flower {
            position: relative;
            width: 80px;
            height: 80px;
            cursor: pointer;
        }

        .petal {
            position: absolute;
            width: 25px;
            height: 40px;
            border-radius: 50% 50% 50% 0;
            top: 0;
            left: 27.5px;
            transform-origin: center 40px;
            opacity: 0;
        }

        .flower:nth-child(1) .petal { background: #ff6b9d; }
        .flower:nth-child(2) .petal { background: #00d4aa; }
        .flower:nth-child(3) .petal { background: #ffd700; }
        .flower:nth-child(4) .petal { background: #4CAF50; }

        .petal:nth-child(1) { transform: rotate(0deg) translateY(-20px); }
        .petal:nth-child(2) { transform: rotate(72deg) translateY(-20px); }
        .petal:nth-child(3) { transform: rotate(144deg) translateY(-20px); }
        .petal:nth-child(4) { transform: rotate(216deg) translateY(-20px); }
        .petal:nth-child(5) { transform: rotate(288deg) translateY(-20px); }

        .center {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            top: 31px;
            left: 31px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .flower.blooming .petal {
            animation: bloom 0.6s ease-out forwards;
        }

        @keyframes bloom {
            to {
                opacity: 1;
                transform: var(--transform);
            }
        }

        .flower:nth-child(1) .petal:nth-child(1) { --transform: rotate(0deg) translateY(-20px); animation-delay: 0s; }
        .flower:nth-child(1) .petal:nth-child(2) { --transform: rotate(72deg) translateY(-20px); animation-delay: 0.1s; }
        .flower:nth-child(1) .petal:nth-child(3) { --transform: rotate(144deg) translateY(-20px); animation-delay: 0.2s; }
        .flower:nth-child(1) .petal:nth-child(4) { --transform: rotate(216deg) translateY(-20px); animation-delay: 0.3s; }
        .flower:nth-child(1) .petal:nth-child(5) { --transform: rotate(288deg) translateY(-20px); animation-delay: 0.4s; }

        .flower:nth-child(2) .petal:nth-child(1) { --transform: rotate(0deg) translateY(-20px); animation-delay: 0.1s; }
        .flower:nth-child(2) .petal:nth-child(2) { --transform: rotate(72deg) translateY(-20px); animation-delay: 0.2s; }
        .flower:nth-child(2) .petal:nth-child(3) { --transform: rotate(144deg) translateY(-20px); animation-delay: 0.3s; }
        .flower:nth-child(2) .petal:nth-child(4) { --transform: rotate(216deg) translateY(-20px); animation-delay: 0.4s; }
        .flower:nth-child(2) .petal:nth-child(5) { --transform: rotate(288deg) translateY(-20px); animation-delay: 0.5s; }

        .flower:nth-child(3) .petal:nth-child(1) { --transform: rotate(0deg) translateY(-20px); animation-delay: 0.2s; }
        .flower:nth-child(3) .petal:nth-child(2) { --transform: rotate(72deg) translateY(-20px); animation-delay: 0.3s; }
        .flower:nth-child(3) .petal:nth-child(3) { --transform: rotate(144deg) translateY(-20px); animation-delay: 0.4s; }
        .flower:nth-child(3) .petal:nth-child(4) { --transform: rotate(216deg) translateY(-20px); animation-delay: 0.5s; }
        .flower:nth-child(3) .petal:nth-child(5) { --transform: rotate(288deg) translateY(-20px); animation-delay: 0.6s; }

        .flower:nth-child(4) .petal:nth-child(1) { --transform: rotate(0deg) translateY(-20px); animation-delay: 0.3s; }
        .flower:nth-child(4) .petal:nth-child(2) { --transform: rotate(72deg) translateY(-20px); animation-delay: 0.4s; }
        .flower:nth-child(4) .petal:nth-child(3) { --transform: rotate(144deg) translateY(-20px); animation-delay: 0.5s; }
        .flower:nth-child(4) .petal:nth-child(4) { --transform: rotate(216deg) translateY(-20px); animation-delay: 0.6s; }
        .flower:nth-child(4) .petal:nth-child(5) { --transform: rotate(288deg) translateY(-20px); animation-delay: 0.7s; }

        .love-bar-container {
            margin: 40px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .love-bar-label {
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .love-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .love-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #ff8fab, #ffa5c0);
            width: 0%;
            animation: fillLove 2s ease-out 1.2s forwards;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.6);
        }

        @keyframes fillLove {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .confetti-button {
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
            font-weight: 600;
            margin-top: 30px;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .confetti-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.6);
        }

        .confetti-button:active {
            transform: translateY(0);
        }

        .photo-container {
            margin-top: 50px;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.4s forwards;
        }

        .photo-container img {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-height: 500px;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart-icon {
            display: inline-block;
            margin: 0 5px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Anneler Günü Kutlaması <span class="heart-icon">❤️</span></h1>
        <p class="subtitle">Sana çok sevgi dolu günler diliyorum</p>

        <div class="flowers-container">
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
            <div class="flower">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
        </div>

        <div class="love-bar-container">
            <div class="love-bar-label">Sevgi Seviyesi <span class="heart-icon">💕</span></div>
            <div class="love-bar">
                <div class="love-fill"></div>
            </div>
        </div>

        <button class="confetti-button" onclick="createConfetti()">Konfeti Patlat! 🎉</button>

        <div class="photo-container">
            <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCADIAOYDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWm5ybnJ2eoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD5/KKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//2Q==" alt="Sana gönderdiklerin" />
        </div>
    </div>

    <script>
        function createConfetti() {
            const colors = ['#ff6b9d', '#ff8fab', '#ffa5c0', '#00d4aa', '#ffd700', '#4CAF50'];
            const confettiCount = 100;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `fall ${2 + Math.random() * 1}s linear forwards`;
                confetti.style.animationDelay = (i * 0.02) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3500);
            }
        }

        // Çiçekleri otomatik aç
        window.addEventListener('load', () => {
            const flowers = document.querySelectorAll('.flower');
            flowers.forEach((flower, index) => {
                setTimeout(() => {
                    flower.classList.add('blooming');
                }, index * 100);
            });
        });
    </script>
</body>
</html>
